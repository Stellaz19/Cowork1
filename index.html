<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้าออนไลน์</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 10px;
    }

    .product h3 {
      margin: 15px 0 8px;
    }

    .price {
      color: #2563eb;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .cart {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 ร้านค้าออนไลน์</h1>
  <p>เลือกสินค้าที่คุณต้องการ</p>
</header>

<div class="container">

  <div class="products" id="products"></div>

  <div class="cart">
    <h2>🛍️ ตะกร้าสินค้า</h2>

    <div id="cartItems">
      ยังไม่มีสินค้า
    </div>

    <div class="total">
      รวม: <span id="total">0</span> บาท
    </div>
  </div>

</div>

<script>

const products = [
  {
    id: 1,
    name: "เสื้อยืด",
    price: 299,
    image: "https://via.placeholder.com/300?text=T-Shirt"
  },
  {
    id: 2,
    name: "รองเท้าผ้าใบ",
    price: 1290,
    image: "https://via.placeholder.com/300?text=Shoes"
  },
  {
    id: 3,
    name: "กระเป๋า",
    price: 590,
    image: "https://via.placeholder.com/300?text=Bag"
  },
  {
    id: 4,
    name: "หูฟัง",
    price: 890,
    image: "https://via.placeholder.com/300?text=Headphones"
  }
];

let cart = [];

function showProducts() {
  const container = document.getElementById("products");

  container.innerHTML = products.map(product => `
    <div class="product">

      <img src="${product.image}" alt="${product.name}">

      <h3>${product.name}</h3>

      <div class="price">
        ${product.price.toLocaleString()} บาท
      </div>

      <button onclick="addToCart(${product.id})">
        เพิ่มลงตะกร้า
      </button>

    </div>
  `).join("");
}

function addToCart(id) {

  const product = products.find(p => p.id === id);

  cart.push(product);

  updateCart();
}

function removeFromCart(index) {

  cart.splice(index, 1);

  updateCart();
}

function updateCart() {

  const cartItems = document.getElementById("cartItems");

  if (cart.length === 0) {
    cartItems.innerHTML = "ยังไม่มีสินค้า";
  } else {

    cartItems.innerHTML = cart.map((item, index) => `
      <div class="cart-item">

        <span>
          ${item.name}
        </span>

        <span>
          ${item.price.toLocaleString()} บาท
          <button onclick="removeFromCart(${index})">
            ลบ
          </button>
        </span>

      </div>
    `).join("");
  }

  const total = cart.reduce(
    (sum, item) => sum + item.price,
    0
  );

  document.getElementById("total").textContent =
    total.toLocaleString();
}

showProducts();

</script>

</body>
</html>
